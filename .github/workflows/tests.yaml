name: tests

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - master
    tags-ignore:
      - '*'

concurrency:
  group: '${{ github.workflow }}-${{ github.ref }}'
  cancel-in-progress: true

jobs:
  twine-check:
    name: Check dist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          activate-environment: true
      - run: uv build
      - run: pipx run twine check --strict dist/*

  test-cp:
    strategy:
      fail-fast: false
      matrix:
        os:
          - 'ubuntu-24.04'
        python-version:
          - '3.10'
          - '3.11'
          - '3.12'
          - '3.13'
          - '3.14'

    runs-on: '${{ matrix.os }}'

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          activate-environment: true

      - run: uv sync --group=dev

      - run: uv run pytest

  test-pass:
    needs:
      - test-cp
      - twine-check
    runs-on: 'ubuntu-slim'
    steps:
      - run: 'echo success'
